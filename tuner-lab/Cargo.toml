[package]
name = "tuner-lab"
version.workspace = true
edition = "2024"
publish = false

[features]
# `engine dump` writes `goertzel.csv` only with this on; `cargo lab-telemetry`
# is the alias that enables it.
telemetry = ["tuner-core/telemetry"]

[dependencies]
tuner-core = { path = "../tuner-core" }

anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
# Figures. `ttf` finds the system's fonts on each OS (fontconfig, Core Text,
# DirectWrite), so no font file ships with the lab.
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "line_series",
    "ttf",
] }
realfft = { workspace = true }
rustfft = { workspace = true }
serde_json = { workspace = true }
