[package]
name = "tuner-core"
version.workspace = true
edition = "2024"

[features]
telemetry = []

[dependencies]
# Use the workspace-defined versions
anyhow = "1.0.102" # For easier error handling

# For running audio on a separate thread and communicating
ringbuf = { workspace = true }
triple_buffer = { workspace = true }
cpal = { workspace = true }

# Add other dependencies for math, etc.
rustfft = { workspace = true }
realfft = { workspace = true }
once_cell = "1.21.3"

# For profile saving and loading
serde =  { workspace = true }
crossbeam-queue = "0.3.12"
crossbeam-channel = "0.5.14"
serde_json.workspace = true
