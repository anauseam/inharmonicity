[package]
name = "tuner-core"
version.workspace = true
edition = "2024"

[features]
telemetry = []

# Hot-path cost, measured. `hot-path.md` makes latency a hard rule; these are its
# regression check. Criterion is a dev-dependency: it ships in nothing.
[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "strobe_cost"
harness = false

[[bench]]
name = "discovery_cost"
harness = false

[dependencies]
anyhow = { workspace = true }
cpal = { workspace = true }
crossbeam-channel = "0.5.16"
crossbeam-queue = { workspace = true }
once_cell = "1.21.4"
realfft = { workspace = true }
ringbuf = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
triple_buffer = { workspace = true }
