[workspace]
members = [
"tuner-core",
"tuner-gui",
]
resolver = "2" # Use the modern feature resolver

# Workspace version. Pre-first-release: the project has never shipped a binary,
# so the number tracks progress toward the initial alpha rather than a released
# line. Cargo requires SemVer, hence `-alpha` rather than " alpha".
[workspace.package]
version = "0.1.0-alpha"

# Define common dependencies for the workspace to ensure version consistency
[workspace.dependencies]
cpal = "0.17.3"
ringbuf = "0.5.0"
triple_buffer = "9.0.0"

rustfft = "6.4.1"
realfft = "3.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"


# Add other common dependencies here