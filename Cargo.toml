[workspace]
members = [
"tuner-core",
"tuner-gui",
"tuner-lab",
]
# `cargo build` and `cargo run` mean the product. The lab is a workspace member
# so `--workspace` lint and test runs cover it, not so it builds by default.
default-members = [
"tuner-core",
"tuner-gui",
]
resolver = "2" # Use the modern feature resolver

# Workspace version. Pre-first-release: the project has never shipped a binary,
# so the number tracks progress toward the initial alpha rather than a released
# line. Cargo requires SemVer, hence `-alpha` rather than " alpha".
[workspace.package]
version = "0.1.0-alpha"

# Define common dependencies for the workspace to ensure version consistency
[workspace.dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
crossbeam-queue = "0.3.13"
ringbuf = "0.5.1"
triple_buffer = "9.0.0"

rustfft = "6.4.1"
realfft = "3.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"


# Add other common dependencies here